<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#c9d1d9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.header { background:#161b22; border-bottom:1px solid #30363d; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.header h1 { font-size:20px; color:#f0f6fc; }
.header h1 span { font-size:14px; color:#8b949e; font-weight:400; margin-left:8px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; }
.filter-btn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:12px; transition:all .2s; }
.filter-btn:hover { border-color:#58a6ff; }
.filter-btn.active { background:#1f6feb; border-color:#1f6feb; color:#fff; animation:btnPop .4s cubic-bezier(.2,.8,.2,1.2); }
.filter-toast { position:fixed; top:0; left:0; right:0; z-index:9999; text-align:center; padding:10px 16px; font-size:13px; font-weight:600; color:#fff; transform:translateY(-100%); transition:transform .3s ease; pointer-events:none; }
.filter-toast.show { transform:translateY(0); }
.filter-toast::after { content:""; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent); animation:toastShine .8s ease; }
@keyframes btnPop { 0% { transform:scale(1); } 40% { transform:scale(1.2); } 70% { transform:scale(0.95); } 100% { transform:scale(1); } }
@keyframes toastShine { 0% { opacity:0; } 30% { opacity:1; } 100% { opacity:0; } }
.org-section { position:relative; background:#0b0f16; border-bottom:1px solid #21262d; overflow:hidden; padding:28px 24px 36px; }
.org-section::before { content:""; position:absolute; inset:-20% -10%; background:radial-gradient(circle at 20% 10%, rgba(88,166,255,.08), transparent 45%), radial-gradient(circle at 80% 30%, rgba(248,113,113,.08), transparent 45%), radial-gradient(circle at 50% 80%, rgba(251,191,36,.08), transparent 45%); filter:blur(0.5px); opacity:.8; }
.org-title { position:relative; z-index:2; font-size:14px; color:#8b949e; letter-spacing:1px; text-transform:uppercase; margin-bottom:16px; }
.org-wrap { position:relative; z-index:2; min-height:420px; }
#starfield { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
#orgLines { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
.org-tiers { position:relative; z-index:3; display:flex; flex-direction:column; gap:22px; }
.tier-top, .tier-mid { display:flex; justify-content:center; }
.tier-bottom { display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }
.role-card { position:relative; border-radius:16px; padding:14px 18px; min-width:200px; max-width:260px; background:rgba(22,27,34,.55); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(14px); box-shadow:0 8px 28px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.04); cursor:pointer; transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease, filter .3s ease; overflow:hidden; font-family:inherit; color:inherit; text-align:left; appearance:none; }
.role-card:focus-visible { outline:2px solid rgba(88,166,255,.8); outline-offset:2px; }
.role-card::after { content:""; position:absolute; inset:-30% -10%; background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.12), transparent 40%); opacity:.65; pointer-events:none; }
.role-card:hover { transform:scale(1.05); filter:brightness(1.1); }
.role-card:hover .role-emoji { animation-duration:.9s; }
.role-card:active { transform:scale(1.02); }
.role-emoji { font-size:28px; display:inline-flex; align-items:center; gap:6px; margin-bottom:6px; will-change:transform; }
.role-name { font-size:16px; font-weight:700; color:#f0f6fc; letter-spacing:.5px; }
.role-title { font-size:12px; color:#c9d1d9; margin-top:4px; }
.role-note { font-size:11px; color:#8b949e; margin-top:6px; line-height:1.3; }
.role-glow { position:absolute; inset:-25%; border-radius:18px; filter:blur(18px); opacity:.55; z-index:-1; }
.role-pipi .role-glow { background:radial-gradient(circle, rgba(251,146,60,.45), transparent 60%); }
.role-fox .role-glow { background:radial-gradient(circle, rgba(88,166,255,.45), transparent 60%); }
.role-eagle .role-glow { background:radial-gradient(circle, rgba(167,139,250,.45), transparent 60%); }
.role-squirrel .role-glow { background:radial-gradient(circle, rgba(52,211,153,.45), transparent 60%); }
.role-bee .role-glow { background:radial-gradient(circle, rgba(251,191,36,.45), transparent 60%); }
.role-ant .role-glow { background:radial-gradient(circle, rgba(248,113,113,.45), transparent 60%); }
.role-owl .role-glow { background:radial-gradient(circle, rgba(168,85,247,.45), transparent 60%); }
.role-card:hover .role-glow { opacity:.85; }
.role-card:hover { box-shadow:0 14px 40px rgba(0,0,0,.6); border-color:rgba(88,166,255,.4); animation:hoverJitter .6s ease-in-out infinite; }
.role-card.active { border-color:#58a6ff; box-shadow:0 0 0 1px rgba(88,166,255,.3), 0 12px 36px rgba(88,166,255,.2); }

.role-crown { font-size:16px; filter:drop-shadow(0 0 6px rgba(251,191,36,.8)); animation:crownSpark 1.2s ease-in-out infinite; }
.role-emoji.eagle { animation:eagleSoar 2.4s ease-in-out infinite; }
.role-emoji.squirrel { animation:squirrelHoard 1.3s ease-in-out infinite; }
.role-emoji.bee { animation:beeZigzag .8s linear infinite; }
.role-emoji.ant { animation:antMarch 1s linear infinite; }
.role-emoji.fox { animation:foxTail 1.6s ease-in-out infinite; }
.role-emoji.owl { animation:owlBlink 2.8s ease-in-out infinite; }
.role-emoji.pipi { animation:pipiPulse 2.4s ease-in-out infinite; }

.fly-in { --fx:0px; --fy:0px; opacity:0; animation:flyIn .9s cubic-bezier(.2,.8,.2,1) forwards; }
.fly-in[data-dir="top"] { --fy:-50px; }
.fly-in[data-dir="left"] { --fx:-60px; }
.fly-in[data-dir="right"] { --fx:60px; }
.fly-in[data-dir="bottom"] { --fy:50px; }
.fly-in[data-delay="1"] { animation-delay:.1s; }
.fly-in[data-delay="2"] { animation-delay:.2s; }
.fly-in[data-delay="3"] { animation-delay:.3s; }
.fly-in[data-delay="4"] { animation-delay:.4s; }
.fly-in[data-delay="5"] { animation-delay:.5s; }
.fly-in[data-delay="6"] { animation-delay:.6s; }

.line-path { stroke:rgba(88,166,255,.6); stroke-width:2; fill:none; filter:drop-shadow(0 0 6px rgba(88,166,255,.55)); }
.line-dot { fill:#f0f6fc; filter:drop-shadow(0 0 8px rgba(88,166,255,.8)); }
.stats { display:flex; gap:16px; padding:12px 24px; background:#161b22; border-bottom:1px solid #30363d; }
.stat { text-align:center; min-width:80px; }
.stat .num { font-size:24px; font-weight:700; }
.stat .label { font-size:11px; color:#8b949e; margin-top:2px; }
.board { display:flex; gap:16px; padding:20px; overflow-x:auto; min-height:calc(100vh - 140px); }
.column { background:#161b22; border:1px solid #30363d; border-radius:8px; min-width:260px; flex:1; display:flex; flex-direction:column; }
.col-header { padding:12px 16px; border-bottom:1px solid #30363d; display:flex; justify-content:space-between; align-items:center; }
.col-title { font-size:14px; font-weight:600; }
.col-count { background:#30363d; color:#8b949e; font-size:11px; padding:2px 8px; border-radius:10px; }
.col-toggle { background:transparent; border:1px solid #30363d; color:#8b949e; font-size:10px; padding:2px 6px; border-radius:10px; cursor:pointer; margin-left:8px; }
.col-toggle:hover { border-color:#58a6ff; color:#c9d1d9; }
.column.collapsed .col-body { display:none; }
.column.collapsed .col-toggle { transform:rotate(-90deg); }
.col-body { padding:8px; flex:1; overflow-y:auto; }
.card { background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:12px; margin-bottom:8px; cursor:default; transition:border-color .2s; }
.card:hover { border-color:#58a6ff; }
.card-title { font-size:13px; font-weight:600; color:#f0f6fc; margin-bottom:6px; line-height:1.4; }
.card-meta { display:flex; flex-wrap:wrap; gap:6px; }
.tag { font-size:10px; padding:2px 8px; border-radius:10px; display:inline-block; }
.tag-agent { border:1px solid; }
.tag-eagle { color:#a78bfa; border-color:#a78bfa; background:rgba(167,139,250,.1); }
.tag-squirrel { color:#34d399; border-color:#34d399; background:rgba(52,211,153,.1); }
.tag-bee { color:#fbbf24; border-color:#fbbf24; background:rgba(251,191,36,.1); }
.tag-ant { color:#f87171; border-color:#f87171; background:rgba(248,113,113,.1); }
.tag-owl { color:#a855f7; border-color:#a855f7; background:rgba(168,85,247,.1); }
.tag-main { color:#58a6ff; border-color:#58a6ff; background:rgba(88,166,255,.1); }
.tag-priority { font-weight:600; }
.tag-p1 { color:#f87171; background:rgba(248,113,113,.15); }
.tag-p2 { color:#fb923c; background:rgba(251,146,60,.15); }
.tag-p3 { color:#fbbf24; background:rgba(251,191,36,.15); }
.tag-p4 { color:#34d399; background:rgba(52,211,153,.15); }
.tag-p5 { color:#8b949e; background:rgba(139,148,158,.15); }
.tag-source { color:#8b949e; background:rgba(139,148,158,.1); }
.card-result { font-size:11px; color:#8b949e; margin-top:6px; padding-top:6px; border-top:1px solid #21262d; }
.card-time { font-size:10px; color:#484f58; margin-top:4px; }
.card-error { font-size:11px; color:#f87171; margin-top:6px; }
.empty { text-align:center; color:#484f58; font-size:12px; padding:24px; }
.refresh-bar { position:fixed; bottom:0; left:0; right:0; background:#161b22; border-top:1px solid #30363d; padding:8px 24px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#484f58; }
.refresh-bar button { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:4px 12px; border-radius:4px; cursor:pointer; font-size:11px; }
.refresh-bar button:hover { border-color:#58a6ff; }
.loading { text-align:center; padding:40px; color:#8b949e; }

@keyframes floatUp {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-6px); }
}
@keyframes swaySide {
  0%,100% { transform:translateX(0); }
  50% { transform:translateX(6px); }
}
@keyframes zigzag {
  0% { transform:translate(0,0); }
  25% { transform:translate(6px,-4px); }
  50% { transform:translate(-4px,2px); }
  75% { transform:translate(5px,6px); }
  100% { transform:translate(0,0); }
}
@keyframes antWalk {
  0% { transform:translateX(0); }
  20% { transform:translateX(2px); }
  40% { transform:translateX(0); }
  60% { transform:translateX(2px); }
  80% { transform:translateX(0); }
  100% { transform:translateX(2px); }
}
@keyframes tailWag {
  0%,100% { transform:rotate(0deg); }
  50% { transform:rotate(10deg); }
}

@keyframes flyIn {
  0% { opacity:0; transform:translate3d(var(--fx,0),var(--fy,0),0) scale(.9); filter:blur(2px); }
  100% { opacity:1; transform:translate3d(0,0,0) scale(1); filter:blur(0); }
}
@keyframes hoverJitter {
  0%,100% { transform:scale(1.05) translate(0,0); }
  25% { transform:scale(1.05) translate(1px,-1px); }
  50% { transform:scale(1.05) translate(-1px,1px); }
  75% { transform:scale(1.05) translate(1px,1px); }
}
@keyframes crownSpark {
  0%,100% { transform:scale(1); opacity:.9; }
  50% { transform:scale(1.15); opacity:1; }
}
@keyframes eagleSoar {
  0% { transform:translate(-6px,4px) rotate(-8deg) scale(1); }
  50% { transform:translate(10px,-8px) rotate(8deg) scale(1.15); }
  100% { transform:translate(-6px,4px) rotate(-8deg) scale(1); }
}
@keyframes squirrelHoard {
  0% { transform:translateX(0) rotate(-4deg) scale(1); }
  25% { transform:translateX(6px) rotate(6deg) scale(1.08); }
  50% { transform:translateX(-6px) rotate(-6deg) scale(1.1); }
  75% { transform:translateX(6px) rotate(8deg) scale(1.08); }
  100% { transform:translateX(0) rotate(-4deg) scale(1); }
}
@keyframes beeZigzag {
  0% { transform:translate(0,0) rotate(0deg); }
  25% { transform:translate(10px,-8px) rotate(10deg); }
  50% { transform:translate(-8px,6px) rotate(-8deg); }
  75% { transform:translate(8px,10px) rotate(12deg); }
  100% { transform:translate(0,0) rotate(0deg); }
}
@keyframes antMarch {
  0% { transform:translateX(-8px); }
  100% { transform:translateX(8px); }
}
@keyframes foxTail {
  0%,100% { transform:rotate(0deg) translateX(0); }
  50% { transform:rotate(14deg) translateX(2px); }
}
@keyframes owlBlink {
  0%,40%,60%,100% { transform:scale(1); }
  45%,55% { transform:scale(1) scaleY(.1); }
  50% { transform:scale(1.08); }
}
@keyframes pipiPulse {
  0%,100% { transform:scale(1); filter:drop-shadow(0 0 4px rgba(251,146,60,.6)); }
  50% { transform:scale(1.12); filter:drop-shadow(0 0 10px rgba(251,146,60,.9)); }
}

@media (max-width: 820px) {
  .header { padding:12px 16px; }
  .filters { flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; }
  .filters::-webkit-scrollbar { height:6px; }
  .filters::-webkit-scrollbar-thumb { background:#30363d; border-radius:999px; }
  .org-section { padding:20px 16px 28px; }
  .org-wrap { min-height:520px; }
  .tier-bottom { gap:12px; }
  .role-card { min-width:160px; max-width:200px; padding:12px 14px; }
  .role-name { font-size:14px; }
  .stats { padding:10px 16px; gap:10px; flex-wrap:wrap; }
  .stat { min-width:64px; }
  .stat .num { font-size:18px; }
  .stat .label { font-size:10px; }
  .board { flex-direction:column; padding:12px 12px 84px; overflow-x:visible; min-height:auto; }
  .column { min-width:100%; width:100%; }
  .card { width:100%; }
  .col-toggle { display:inline-flex; }
  .refresh-bar { padding:8px 12px; flex-direction:column; align-items:flex-start; gap:6px; }
}

@media (prefers-reduced-motion: reduce) {
  .role-emoji { animation:none !important; }
  .role-card { animation:none !important; }
}
</style>

<script>
(function(){
  var u = localStorage.getItem('mcn_current_user');
  if(u) document.getElementById('mcn-nav').style.display='flex';
  // highlight current page
  var links = document.querySelectorAll('#mcn-nav a');
  var path = location.pathname.split('/').pop() || 'index.html';
  links.forEach(function(a){
    if(a.getAttribute('href') === path){
      a.style.color='#6366f1';
      a.style.fontWeight='600';
    }
    a.addEventListener('mouseover',function(){this.style.color='#e2e8f0';});
    a.addEventListener('mouseout',function(){
      if(this.getAttribute('href')===path){this.style.color='#6366f1';}
      else{this.style.color='#94a3b8';}
    });
  });
})();
</script>

<script>
const { url, anonKey } = window.SUPABASE_DEFAULTS;
const sb = supabase.createClient(url, anonKey);

const COLUMNS = [
  { status: 'spawned', title: '⚪ 已派发', color: '#8b949e' },
  { status: 'running', title: '🔵 执行中', color: '#58a6ff' },
  { status: 'returned', title: '✅ 已完成', color: '#34d399' },
  { status: 'failed', title: '❌ 失败', color: '#f87171' },
  { status: 'timeout', title: '⏰ 超时', color: '#fbbf24' }
];

const AGENTS = {
  'mcn-eagle': { emoji: '🦅', name: '鹰眼' },
  'mcn-squirrel': { emoji: '🐿️', name: '松鼠' },
  'mcn-bee': { emoji: '🐝', name: '蜜蜂' },
  'mcn-ant': { emoji: '🐜', name: '蚂蚁' },
  'mcn-owl': { emoji: '🦉', name: '猫头鹰' },
  zhuazhua: { emoji: '🦊', name: '爪爪' },
  // 兼容旧短名
  eagle: { emoji: '🦅', name: '鹰眼' },
  squirrel: { emoji: '🐿️', name: '松鼠' },
  bee: { emoji: '🐝', name: '蜜蜂' },
  ant: { emoji: '🐜', name: '蚂蚁' },
  owl: { emoji: '🦉', name: '猫头鹰' },
  main: { emoji: '🦊', name: '爪爪' }
};

const TRIGGER_LABELS = { manual: '👤手动', cron: '⏰定时', heartbeat_retry: '🔄重试' };

function agentShortName(id) {
  if (!id) return '';
  if (id.startsWith('mcn-')) return id.replace('mcn-', '');
  if (id === 'zhuazhua') return 'main';
  return id;
}

let currentFilter = 'all';
let allTasks = [];
const collapsedByStatus = { spawned:false, running:false, returned:false, failed:false, timeout:false };

const AGENT_LABELS = {
  all: { emoji:'🌟', name:'全部', color:'#58a6ff' },
  main: { emoji:'🦊', name:'爪爪 · COO', color:'#58a6ff' },
  eagle: { emoji:'🦅', name:'鹰眼 · 策划部', color:'#a78bfa' },
  squirrel: { emoji:'🐿️', name:'松鼠 · 采集部', color:'#34d399' },
  bee: { emoji:'🐝', name:'蜜蜂 · 生产部', color:'#fbbf24' },
  ant: { emoji:'🐜', name:'蚂蚁 · 运营部', color:'#f87171' },
  owl: { emoji:'🦉', name:'猫头鹰 · 数据部', color:'#a855f7' }
};

function showFilterToast(agent) {
  const info = AGENT_LABELS[agent] || AGENT_LABELS.all;
  const toast = document.getElementById('filterToast');
  toast.textContent = info.emoji + ' 切换到：' + info.name;
  toast.style.background = 'linear-gradient(135deg, ' + info.color + ', ' + info.color + '88)';
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 1200);
}

function setFilter(agent) {
  if (currentFilter !== agent) showFilterToast(agent);
  currentFilter = agent;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.agent === agent);
  });
  document.querySelectorAll('.role-card').forEach(b => {
    b.classList.toggle('active', b.dataset.agent === agent);
  });
  render();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setFilter(btn.dataset.agent);
  });
});

document.querySelectorAll('.role-card').forEach(btn => {
  btn.addEventListener('click', () => {
    setFilter(btn.dataset.agent);
  });
});

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function initStarfield() {
  const canvas = document.getElementById('starfield');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const stars = [];
  let w = 0;
  let h = 0;

  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars.length = 0;
    const count = Math.min(140, Math.max(60, Math.floor(w * h / 9000)));
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.4 + 0.4,
        vx: (Math.random() * 0.2 + 0.05) * (Math.random() > 0.5 ? 1 : -1),
        vy: (Math.random() * 0.2 + 0.05) * (Math.random() > 0.5 ? 1 : -1),
        a: Math.random() * 0.6 + 0.2,
        tw: Math.random() * 0.02 + 0.01
      });
    }
  };

  const draw = () => {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.a += s.tw * (Math.random() > 0.5 ? 1 : -1);
      s.a = Math.max(0.2, Math.min(1, s.a));
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < -10) s.x = w + 10;
      if (s.x > w + 10) s.x = -10;
      if (s.y < -10) s.y = h + 10;
      if (s.y > h + 10) s.y = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(200,220,255,${s.a})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    if (!prefersReducedMotion) requestAnimationFrame(draw);
  };

  resize();
  draw();
  window.addEventListener('resize', () => {
    clearTimeout(resize._t);
    resize._t = setTimeout(() => {
      resize();
      if (prefersReducedMotion) draw();
    }, 120);
  });
}

function buildOrgLines() {
  const wrap = document.querySelector('.org-wrap');
  const svg = document.getElementById('orgLines');
  if (!wrap || !svg) return;
  const rect = wrap.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  svg.innerHTML = '';

  const pipi = document.querySelector('.role-pipi');
  const fox = document.querySelector('.role-fox');
  const bottoms = [
    document.querySelector('.role-eagle'),
    document.querySelector('.role-squirrel'),
    document.querySelector('.role-bee'),
    document.querySelector('.role-ant'),
    document.querySelector('.role-owl')
  ].filter(Boolean);
  if (!pipi || !fox || !bottoms.length) return;

  const anchor = (el, edge) => {
    const r = el.getBoundingClientRect();
    const x = r.left - rect.left + r.width / 2;
    const y = edge === 'top' ? r.top - rect.top : r.bottom - rect.top;
    return { x, y };
  };
  const top = anchor(pipi, 'bottom');
  const midTop = anchor(fox, 'top');
  const midBottom = anchor(fox, 'bottom');

  const ns = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(ns, 'defs');
  const marker = document.createElementNS(ns, 'marker');
  marker.setAttribute('id', 'arrowHead');
  marker.setAttribute('viewBox', '0 0 10 10');
  marker.setAttribute('refX', '8');
  marker.setAttribute('refY', '5');
  marker.setAttribute('markerWidth', '6');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('orient', 'auto');
  const arrowPath = document.createElementNS(ns, 'path');
  arrowPath.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
  arrowPath.setAttribute('fill', 'rgba(88,166,255,.8)');
  marker.appendChild(arrowPath);
  defs.appendChild(marker);
  svg.appendChild(defs);
  const addLine = (a, b, delay) => {
    const path = document.createElementNS(ns, 'path');
    const curve = Math.max(40, Math.abs(b.y - a.y) * 0.4);
    const d = `M ${a.x} ${a.y} C ${a.x} ${a.y + curve}, ${b.x} ${b.y - curve}, ${b.x} ${b.y}`;
    path.setAttribute('d', d);
    path.setAttribute('class', 'line-path');
    path.setAttribute('marker-end', 'url(#arrowHead)');
    svg.appendChild(path);

    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('r', '3.2');
    dot.setAttribute('class', 'line-dot');
    if (!prefersReducedMotion) {
      const anim = document.createElementNS(ns, 'animateMotion');
      anim.setAttribute('dur', '2.8s');
      anim.setAttribute('repeatCount', 'indefinite');
      anim.setAttribute('path', d);
      anim.setAttribute('begin', `-${delay}s`);
      dot.appendChild(anim);
    } else {
      dot.setAttribute('cx', String((a.x + b.x) / 2));
      dot.setAttribute('cy', String((a.y + b.y) / 2));
    }
    svg.appendChild(dot);
  };

  addLine(top, midTop, 0.3);
  bottoms.forEach((el, i) => {
    const end = anchor(el, 'top');
    addLine(midBottom, end, 0.6 + i * 0.4);
  });
}

initStarfield();
buildOrgLines();
window.addEventListener('resize', () => {
  clearTimeout(buildOrgLines._t);
  buildOrgLines._t = setTimeout(buildOrgLines, 150);
});

document.getElementById('board').addEventListener('click', (e) => {
  const toggle = e.target.closest('.col-toggle');
  if (!toggle) return;
  const status = toggle.dataset.status;
  if (!status) return;
  collapsedByStatus[status] = !collapsedByStatus[status];
  render();
});

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function renderCard(t) {
  const a = AGENTS[t.child_agent_id] || { emoji:'?', name: t.child_agent_id };
  const shortName = agentShortName(t.child_agent_id);
  const triggerLabel = TRIGGER_LABELS[t.trigger_type] || t.trigger_type;

  let extra = '';
  if (t.status === 'returned' && t.result_summary) {
    extra = `<div class="card-result">${t.result_summary}</div>`;
  }
  if (t.status === 'failed' && t.error_reason) {
    extra = `<div class="card-error">${t.error_reason}</div>`;
  }
  if (t.status === 'timeout') {
    extra = `<div class="card-error">执行超时</div>`;
  }

  let timeInfo = '';
  if (t.finished_at) {
    timeInfo = `完成于 ${formatTime(t.finished_at)}`;
  } else if (t.started_at) {
    timeInfo = `开始于 ${formatTime(t.started_at)}`;
  } else {
    timeInfo = `创建于 ${formatTime(t.created_at)}`;
  }

  return `<div class="card">
    <div class="card-title">${t.task_id}</div>
    <div class="card-meta">
      <span class="tag tag-agent tag-${shortName}">${a.emoji} ${a.name}</span>
      <span class="tag tag-source">${triggerLabel}</span>
    </div>
    ${extra}
    <div class="card-time">${timeInfo} · ${t.id.slice(0,8)}</div>
  </div>`;
}
function render() {
  const filtered = currentFilter === 'all'
    ? allTasks
    : allTasks.filter(t => agentShortName(t.child_agent_id) === currentFilter);

  // Stats
  const counts = { spawned:0, running:0, returned:0, failed:0, timeout:0 };
  filtered.forEach(t => {
    if (counts[t.status] !== undefined) counts[t.status]++;
  });
  const total = filtered.length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num" style="color:#c9d1d9">${total}</div><div class="label">总计</div></div>
    <div class="stat"><div class="num" style="color:#8b949e">${counts.spawned}</div><div class="label">已派发</div></div>
    <div class="stat"><div class="num" style="color:#58a6ff">${counts.running}</div><div class="label">执行中</div></div>
    <div class="stat"><div class="num" style="color:#34d399">${counts.returned}</div><div class="label">已完成</div></div>
    <div class="stat"><div class="num" style="color:#f87171">${counts.failed}</div><div class="label">失败</div></div>
    <div class="stat"><div class="num" style="color:#fbbf24">${counts.timeout}</div><div class="label">超时</div></div>
  `;

  // Board
  const board = document.getElementById('board');
  board.innerHTML = COLUMNS.map(col => {
    const tasks = filtered
      .filter(t => t.status === col.status)
      .sort((a, b) => a.priority - b.priority || new Date(a.created_at) - new Date(b.created_at));
    const cards = tasks.length
      ? tasks.map(renderCard).join('')
      : '<div class="empty">暂无任务</div>';
    const collapsed = collapsedByStatus[col.status];
    return `<div class="column ${collapsed ? 'collapsed' : ''}">
      <div class="col-header">
        <span class="col-title" style="color:${col.color}">${col.title}</span>
        <span>
          <span class="col-count">${tasks.length}</span>
          <button class="col-toggle" data-status="${col.status}" title="折叠/展开">▾</button>
        </span>
      </div>
      <div class="col-body">${cards}</div>
    </div>`;
  }).join('');
}

// agent_runs 表已停用 (2026-03-30)，任务看板暂无可用数据源
async function loadTasks() {
  // 已停用：不再从 agent_runs 读取数据
  allTasks = [];
  render();
  document.getElementById('lastUpdate').textContent =
    '最后更新: ' + new Date().toLocaleTimeString('zh-CN') + ' (agent_runs 已停用)';
}

loadTasks();
setFilter(currentFilter);
setInterval(() => {
  if (document.getElementById('autoRefresh').checked) loadTasks();
}, 30000);
