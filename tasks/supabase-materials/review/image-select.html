<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生成图审核</title>
  <link rel="stylesheet" href="shared.css?v=202604081528" />
  <link rel="stylesheet" href="image-select.css?v=202604081528" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=202604081528"></script>
  <script src="auth.js?v=202604081528"></script>
  <script>
    Auth.requireLogin();
  </script>
</head>
<body>
<nav id="mcn-nav" style="background:#111827;border-bottom:1px solid #1e293b;padding:8px 16px;font-size:13px;display:none;gap:12px;flex-wrap:wrap;align-items:center;position:relative;z-index:9999;"></nav>
<script src="nav.js?v=202604081528c"></script>

  <main class="app">
    <header class="topbar">
      <div>
        <h1 id="page-title">生成图审核</h1>
        <p class="subtitle" id="page-subtitle">选择通过的人脸图</p>
      </div>
      <div class="status" id="status">未连接</div>
    </header>

    <section class="config" id="config">
      <label>
        Supabase 地址
        <input id="supabase-url" type="text" placeholder="https://xxxx.supabase.co" />
      </label>
      <label>
        匿名密钥
        <input id="supabase-key" type="password" placeholder="eyJhbGci..." />
      </label>
      <button id="connect">连接</button>
    </section>

    <section id="task-list" class="task-list" style="display:none;">
      <div class="section-head">
        <div class="head-left">
          <h2>任务列表</h2>
          <div id="tab-container" class="tab-container"></div>
        </div>
        <button id="refresh-tasks" class="ghost">刷新</button>
      </div>
      <div id="task-items" class="task-items"></div>
    </section>

    <section id="gallery" class="gallery" style="display:none;">
      <div class="section-head">
        <h2 id="gallery-title">图片画廊</h2>
        <div class="head-actions">
          <button id="back-to-list" class="ghost">返回任务</button>
        </div>
      </div>
      <div id="task-meta" class="task-meta"></div>
      <div id="ref-images" class="ref-images" style="display:none;"></div>
      <div id="image-grid" class="image-grid"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner">
      <img id="lightbox-image" alt="预览" />
      <button id="lightbox-close">关闭</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottom-bar" style="display:none;">
    <div class="bottom-content">
      <div class="selected-count">已选 <span id="selected-count">0</span> 张</div>
      <button id="reject-all" class="danger">全部不合格</button>
      <button id="confirm-selection" class="primary" disabled>确认选择</button>
    </div>
  </div>

  <script src="image-select.js?v=202604081528"></script>
</body>
</html>
