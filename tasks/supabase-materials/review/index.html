<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>素材审核</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="image-select.css" />
  <style>
    @media (max-width: 640px) {
      #batch-list > div {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    Auth.requireLogin();
  </script>
</head>
<body>
<nav id="mcn-nav" style="background:#111827;border-bottom:1px solid #1e293b;padding:8px 16px;font-size:13px;display:none;gap:12px;flex-wrap:wrap;align-items:center;position:relative;z-index:9999;">
  <a href="requirement.html" style="color:#94a3b8;text-decoration:none;">需求追踪</a>
  <a href="index.html" style="color:#94a3b8;text-decoration:none;">素材审核</a>
  <a href="image-select.html" style="color:#94a3b8;text-decoration:none;">生图审核</a>
  <a href="draft-review.html" style="color:#94a3b8;text-decoration:none;">草稿审核</a>
  <a href="dashboard.html" style="color:#94a3b8;text-decoration:none;">数据看板</a>
  <a href="tasks.html" style="color:#94a3b8;text-decoration:none;">任务看板</a>
  <a href="command-log.html" style="color:#94a3b8;text-decoration:none;">指令日志</a>
  <a href="user-manage.html" style="color:#94a3b8;text-decoration:none;">用户管理</a>
</nav>
<script>
(function(){
  var u = localStorage.getItem('mcn_current_user');
  if(u) document.getElementById('mcn-nav').style.display='flex';
  // highlight current page
  var links = document.querySelectorAll('#mcn-nav a');
  var path = location.pathname.split('/').pop() || 'index.html';
  links.forEach(function(a){
    if(a.getAttribute('href') === path){
      a.style.color='#6366f1';
      a.style.fontWeight='600';
    }
    a.addEventListener('mouseover',function(){this.style.color='#e2e8f0';});
    a.addEventListener('mouseout',function(){
      if(this.getAttribute('href')===path){this.style.color='#6366f1';}
      else{this.style.color='#94a3b8';}
    });
  });
})();
</script>

  <main class="app">
    <header class="topbar">
      <div>
        <h1 id="page-title">素材审核</h1>
        <p class="subtitle" id="page-subtitle">右滑通过，左滑拒绝</p>
        <div id="batch-info" style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;"></div>
      </div>
      <div class="status" id="status">未连接</div>
    </header>

    <!-- 批次列表 -->
    <section id="batch-list" class="task-list" style="display:none;">
      <div class="section-head">
        <h2>选择批次</h2>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; align-items:start;">
        <div>
          <div style="font-weight:600; font-size:13px; color:#94a3b8; margin-bottom:12px; text-transform:uppercase; letter-spacing:0.05em;">🤍 颜值素材</div>
          <div id="batch-items-face" class="task-items"></div>
        </div>
        <div>
          <div style="font-weight:600; font-size:13px; color:#94a3b8; margin-bottom:12px; text-transform:uppercase; letter-spacing:0.05em;">💅 美甲素材</div>
          <div id="batch-items-nail" class="task-items"></div>
        </div>
        <div>
          <div style="font-weight:600; font-size:13px; color:#94a3b8; margin-bottom:12px; text-transform:uppercase; letter-spacing:0.05em;">💅🤍 颜值美甲</div>
          <div id="batch-items-nail-face" class="task-items"></div>
        </div>
      </div>
    </section>

    <!-- 审核完成页 -->
    <section id="done-screen" style="display:none; text-align:center; padding:60px 20px;">
      <div style="font-size:80px; margin-bottom:16px;">✅</div>
      <h2 style="font-size:24px; margin:0 0 12px;">审核完成！</h2>
      <p id="done-stats" style="font-size:16px; color:#64748b; margin:0 0 24px;"></p>
      <button id="btn-back" style="padding:12px 32px; font-size:16px; border-radius:12px; border:none; background:#6366f1; color:#fff; cursor:pointer;">返回批次列表</button>
    </section>

    <section class="config" id="config">
      <label>
        Supabase 地址
        <input id="supabase-url" type="text" placeholder="https://xxxx.supabase.co" />
      </label>
      <label>
        匿名密钥
        <input id="supabase-key" type="password" placeholder="eyJhbGci..." />
      </label>
      <button id="connect">连接</button>
    </section>

    <section class="deck">
      <div class="card" id="card">
        <div class="badge badge-approve" id="badge-approve">通过</div>
        <div class="badge badge-reject" id="badge-reject">拒绝</div>
        <img id="card-image" alt="素材" />
        <div class="card-meta">
          <div class="meta-tags" id="meta-tags"></div>
          <div class="meta-bottom">
            <span id="meta-mood">--</span>
            <span id="meta-res">--</span>
          </div>
        </div>
      </div>
    </section>

    <section class="actions">
      <button class="reject" id="btn-reject">✗ 拒绝</button>
      <button class="approve" id="btn-approve">✓ 通过</button>
    </section>

    <footer class="footer">
      <span id="progress">已通过 0 · 已拒绝 0 · 0 / 0</span>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner">
      <img id="lightbox-image" alt="预览" />
      <button id="lightbox-close">关闭</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
