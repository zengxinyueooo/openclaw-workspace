<style>
/* Page-specific styles */
.log-filters {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: var(--space-5);
}
.chip {
  padding: 6px 16px; border-radius: var(--radius-full);
  font-size: 0.8125rem; font-weight: 600;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); cursor: pointer;
  transition: all var(--transition-fast);
}
.chip:hover { border-color: var(--border-hover); color: var(--text); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.active[data-agent="eagle"] { background: rgba(96,165,250,.15); border-color: #60a5fa; color: #60a5fa; }
.chip.active[data-agent="squirrel"] { background: rgba(251,191,36,.15); border-color: #fbbf24; color: #fbbf24; }
.chip.active[data-agent="bee"] { background: rgba(251,146,60,.15); border-color: #fb923c; color: #fb923c; }
.chip.active[data-agent="ant"] { background: rgba(248,113,113,.15); border-color: #f87171; color: #f87171; }
.chip.active[data-agent="main"] { background: rgba(168,85,247,.15); border-color: #a855f7; color: #a855f7; }
.chip.active[data-agent="owl"] { background: rgba(168,85,247,.15); border-color: #a855f7; color: #a855f7; }

/* Timeline */
.timeline { position: relative; padding-left: 32px; }
.timeline::before {
  content: ""; position: absolute; left: 11px; top: 0; bottom: 0;
  width: 2px; background: linear-gradient(180deg, var(--accent) 0%, var(--border) 100%);
  border-radius: 2px;
}
.log-entry {
  position: relative; margin-bottom: var(--space-5);
  animation: fadeSlideIn 0.3s ease-out both;
}
.log-entry:nth-child(1) { animation-delay: 0s; }
.log-entry:nth-child(2) { animation-delay: 0.04s; }
.log-entry:nth-child(3) { animation-delay: 0.08s; }
.log-entry:nth-child(4) { animation-delay: 0.12s; }
.log-entry:nth-child(5) { animation-delay: 0.16s; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}
/* Timeline dot */
.log-dot {
  position: absolute; left: -27px; top: 6px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--bg); border: 2.5px solid var(--accent);
  z-index: 2;
}
.log-dot.done { border-color: var(--success); background: var(--success); box-shadow: 0 0 8px rgba(16,185,129,.4); }
.log-dot.failed { border-color: var(--danger); background: var(--danger); box-shadow: 0 0 8px rgba(239,68,68,.4); }
.log-dot.running { border-color: var(--warning); animation: dotPulse 1.5s ease-in-out infinite; }
.log-dot.pending { border-color: var(--text-muted); }
@keyframes dotPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.4); }
  50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
}

/* Card body */
.log-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5);
  transition: all var(--transition-fast);
}
.log-card:hover {
  border-color: var(--border-hover);
  box-shadow: var(--shadow-lg);
}
.log-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: var(--space-3);
  margin-bottom: var(--space-2);
}
.log-title {
  font-weight: 600; font-size: 0.9375rem; color: var(--text);
  flex: 1; line-height: 1.4;
}
.log-meta {
  display: flex; gap: var(--space-3); flex-wrap: wrap;
  align-items: center; font-size: 0.75rem;
  color: var(--text-muted);
}
.agent-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: var(--radius-full);
  font-size: 0.6875rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
}
.agent-tag.eagle { background: rgba(96,165,250,.15); color: #60a5fa; }
.agent-tag.squirrel { background: rgba(251,191,36,.15); color: #fbbf24; }
.agent-tag.bee { background: rgba(251,146,60,.15); color: #fb923c; }
.agent-tag.ant { background: rgba(248,113,113,.15); color: #f87171; }
.agent-tag.main { background: rgba(168,85,247,.15); color: #a855f7; }
.agent-tag.owl { background: rgba(168,85,247,.15); color: #a855f7; }
.log-desc {
  color: var(--text-secondary); font-size: 0.8125rem;
  line-height: 1.5; margin-top: var(--space-2);
}
.log-result {
  margin-top: var(--space-3); padding: var(--space-3) var(--space-4);
  background: var(--bg-elevated); border-radius: var(--radius);
  font-size: 0.8125rem; color: var(--text-secondary);
  border-left: 3px solid var(--success);
  max-height: 120px; overflow-y: auto;
}
.log-result.error-result { border-left-color: var(--danger); }
.log-time {
  font-size: 0.6875rem; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.log-duration {
  font-size: 0.6875rem; color: var(--text-muted);
  padding: 2px 8px; background: var(--bg-elevated);
  border-radius: var(--radius-full);
}

/* Stats bar */
.stats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--space-4); margin-bottom: var(--space-6);
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5);
  text-align: center;
}
.stat-num {
  font-size: 1.75rem; font-weight: 700;
  background: linear-gradient(135deg, var(--accent) 0%, var(--success) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

/* Search */
.search-box {
  position: relative; margin-bottom: var(--space-5);
}
.search-box input {
  padding-left: 40px; width: 100%;
}
.search-box::before {
  content: "🔍"; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); font-size: 14px;
}

/* Load more */
.load-more {
  text-align: center; padding: var(--space-6) 0;
}

/* Responsive */
@media (max-width: 640px) {
  .timeline { padding-left: 24px; }
  .log-dot { left: -20px; width: 10px; height: 10px; }
  .log-header { flex-direction: column; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<nav id="mcn-nav" style="background:#111827;border-bottom:1px solid #1e293b;padding:8px 16px;font-size:13px;display:none;gap:12px;flex-wrap:wrap;align-items:center;position:relative;z-index:9999;"></nav>
<script src="nav.js?v=202604082205c"></script>

<div class="app">
  <div class="topbar">
    <div class="topbar-content">
      <h1>📋 指令日志</h1>
      <div class="subtitle">皮皮下达的所有指令 · 任务执行全记录</div>
    </div>
    <div class="status ok" id="connStatus">
      <span>在线</span>
    </div>
  </div>
  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">-</div>
      <div class="stat-label">总指令数</div>

    <div class="stat-card">
      <div class="stat-num" id="statDone">-</div>
      <div class="stat-label">已完成</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statRunning">-</div>
      <div class="stat-label">执行中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statFailed">-</div>
      <div class="stat-label">失败</div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索指令内容...">
  </div>

  <!-- Date range + Filters -->
  <div class="log-filters" id="dateBar" style="margin-bottom:var(--space-3)">
    <button class="chip active" data-days="1">今天</button>
    <button class="chip" data-days="3">最近3天</button>
    <button class="chip" data-days="7">最近7天</button>
    <button class="chip" data-days="0">全部</button>
  </div>
  <div class="log-filters" id="filterBar">
    <button class="chip active" data-filter="all">全部</button>
    <button class="chip" data-agent="eagle" data-filter="eagle">🦅 鹰眼</button>
    <button class="chip" data-agent="squirrel" data-filter="squirrel">🐿️ 松鼠</button>
    <button class="chip" data-agent="bee" data-filter="bee">🐝 蜜蜂</button>
    <button class="chip" data-agent="ant" data-filter="ant">🐜 蚂蚁</button>
    <button class="chip" data-agent="owl" data-filter="owl">🦉 猫头鹰</button>
    <span style="border-left:1px solid var(--border);margin:0 4px"></span>
    <button class="chip" data-filter="type-cron">⏰ 定时直执行</button>
    <button class="chip" data-filter="type-agent">🦊 爪爪委派</button>
    <span style="border-left:1px solid var(--border);margin:0 4px"></span>
    <button class="chip" data-filter="done">✅ 完成</button>
    <button class="chip" data-filter="running">⏳ 执行中</button>
    <button class="chip" data-filter="failed">❌ 失败</button>
  </div>

  <!-- Timeline -->
  <div class="timeline" id="timeline">
    <div class="empty-state">
      <div class="empty-state-icon">⏳</div>
      <div>加载中...</div>
    </div>
  </div>

  <!-- Load more -->
  <div class="load-more" id="loadMore" style="display:none">
    <button class="ghost" id="loadMoreBtn">加载更多</button>
  </div>
</div>
<script>
// agent_runs 表用 mcn-xxx 格式，映射到显示名
const AGENT_MAP = {
  zhuazhua: { emoji: '🦊', name: '爪爪', color: '#a855f7', cls: 'main' },
  'mcn-eagle': { emoji: '🦅', name: '鹰眼', color: '#60a5fa', cls: 'eagle' },
  'mcn-squirrel': { emoji: '🐿️', name: '松鼠', color: '#fbbf24', cls: 'squirrel' },
  'mcn-bee': { emoji: '🐝', name: '蜜蜂', color: '#fb923c', cls: 'bee' },
  'mcn-ant': { emoji: '🐜', name: '蚂蚁', color: '#f87171', cls: 'ant' },
  'mcn-owl': { emoji: '🦉', name: '猫头鹰', color: '#a855f7', cls: 'owl' },
  // 兼容旧短名
  main: { emoji: '🦊', name: '爪爪', color: '#a855f7', cls: 'main' },
  eagle: { emoji: '🦅', name: '鹰眼', color: '#60a5fa', cls: 'eagle' },
  squirrel: { emoji: '🐿️', name: '松鼠', color: '#fbbf24', cls: 'squirrel' },
  bee: { emoji: '🐝', name: '蜜蜂', color: '#fb923c', cls: 'bee' },
  ant: { emoji: '🐜', name: '蚂蚁', color: '#f87171', cls: 'ant' },
  owl: { emoji: '🦉', name: '猫头鹰', color: '#a855f7', cls: 'owl' }
};
const STATUS_MAP = {
  returned: { label: '完成', cls: 'done' },
  running: { label: '执行中', cls: 'running' },
  failed: { label: '失败', cls: 'failed' },
  spawned: { label: '已派发', cls: 'running' },
  timeout: { label: '超时', cls: 'failed' }
};
// 从 child_agent_id 提取过滤用的短名
function agentShortName(id) {
  if (!id) return '';
  if (id.startsWith('mcn-')) return id.replace('mcn-', '');
  if (id === 'zhuazhua') return 'main';
  return id;
}

let sb, allTasks = [], currentFilter = 'all', searchQuery = '', page = 0, currentDays = 1;
const PAGE_SIZE = 30;

async function init() {
  const d = window.SUPABASE_DEFAULTS || {};
  const url = d.url;
  const key = d.anonKey;
  if (!url || !key) {
    document.getElementById('connStatus').className = 'status error';
    document.getElementById('connStatus').innerHTML = '<span>未配置</span>';
    return;
  }
  sb = supabase.createClient(url, key);
  await loadTasks();
  setupFilters();
  setupSearch();
  // agent_runs 表已停用 (2026-03-30)，不再订阅 realtime
}

async function loadTasks() {
  try {
    // 1. 拉 cron_runs（最近100条）— 子 agent 直接执行的定时任务
    const { data: cronRows, error: cronErr } = await sb
      .from('cron_runs')
      .select('*')
      .order('started_at', { ascending: false })
      .limit(100);
    if (cronErr) throw cronErr;

    // 2. 拉 agent_runs（最近200条）— 爪爪 spawn 的子任务（手动 + cron 委派）
    const { data: agentRows, error: agentErr } = await sb
      .from('agent_runs')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(200);
    if (agentErr) throw agentErr;

    // 3. 统一格式，合并成一条时间线
    const cronItems = (cronRows || []).map(c => ({
      _type: 'cron',          // ⏰ 定时直执行
      _sortTime: c.started_at,
      id: c.id,
      title: c.cron_name,
      agent_id: c.agent_id,
      status: c.status === 'ok' ? 'returned' : 'failed',
      result_summary: c.summary,
      created_at: c.started_at,
      finished_at: c.finished_at,
    }));

    const agentItems = (agentRows || []).map(ar => ({
      _type: ar.trigger_type === 'cron' ? 'agent-cron' : 'agent-manual', // 🦊 cron委派 or 🦊 手动
      _sortTime: ar.created_at,
      id: ar.id,
      title: ar.task_id,
      agent_id: ar.child_agent_id,
      status: ar.status,
      result_summary: ar.result_summary,
      error_reason: ar.error_reason,
      created_at: ar.created_at,
      finished_at: ar.finished_at,
      started_at: ar.started_at,
      trigger_type: ar.trigger_type,
      metadata: ar.metadata,
    }));

    allTasks = [...cronItems, ...agentItems]
      .sort((a, b) => new Date(b._sortTime) - new Date(a._sortTime));

    document.getElementById('connStatus').className = 'status success';
    document.getElementById('connStatus').innerHTML = '<span>● 已连接</span>';
  } catch (e) {
    console.error(e);
    document.getElementById('connStatus').className = 'status error';
    document.getElementById('connStatus').innerHTML = `<span>加载失败: ${e.message}</span>`;
    allTasks = [];
  }
  updateStats();
  renderTimeline();
}
function updateStats() {
  const total = allTasks.length;
  const done = allTasks.filter(t => t.status === 'returned' || t.status === 'ok').length;
  const running = allTasks.filter(t => ['running','spawned'].includes(t.status)).length;
  const failed = allTasks.filter(t => ['failed','timeout'].includes(t.status)).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statRunning').textContent = running;
  document.getElementById('statFailed').textContent = failed;
}

function getFiltered() {
  let list = allTasks;
  // 日期范围过滤
  if (currentDays > 0) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - (currentDays - 1));
    cutoff.setHours(0, 0, 0, 0);
    list = list.filter(t => new Date(t._sortTime) >= cutoff);
  }
  if (currentFilter !== 'all') {
    if (['done','running','failed'].includes(currentFilter)) {
      list = list.filter(t => {
        if (currentFilter === 'done') return ['returned','ok'].includes(t.status);
        if (currentFilter === 'running') return ['running','spawned'].includes(t.status);
        if (currentFilter === 'failed') return ['failed','timeout'].includes(t.status);
        return false;
      });
    } else if (currentFilter === 'type-cron') {
      list = list.filter(t => t._type === 'cron');
    } else if (currentFilter === 'type-agent') {
      list = list.filter(t => t._type === 'agent-cron' || t._type === 'agent-manual');
    } else {
      list = list.filter(t => agentShortName(t.agent_id) === currentFilter);
    }
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(t =>
      (t.title||'').toLowerCase().includes(q) ||
      (t.result_summary||'').toLowerCase().includes(q) ||
      (t.error_reason||'').toLowerCase().includes(q) ||
      (t.agent_id||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDuration(start, end) {
  if (!start || !end) return '';
  const ms = new Date(end) - new Date(start);
  if (ms < 0) return '';
  if (ms < 60000) return Math.round(ms/1000) + 's';
  if (ms < 3600000) return Math.floor(ms/60000) + 'm ' + Math.round((ms%60000)/1000) + 's';
  return Math.floor(ms/3600000) + 'h ' + Math.floor((ms%3600000)/60000) + 'm';
}
// 来源标签配置
const SOURCE_TAG = {
  'cron':         { label: '⏰ 定时直执行', color: '#60a5fa', bg: 'rgba(96,165,250,.12)' },
  'agent-cron':   { label: '🦊 cron委派',   color: '#a78bfa', bg: 'rgba(167,139,250,.12)' },
  'agent-manual': { label: '🦊 手动委派',   color: '#fb923c', bg: 'rgba(251,146,60,.12)'  },
};

function renderRow(t) {
  const agent = AGENT_MAP[t.agent_id] || { emoji:'❓', name: t.agent_id||'未知', cls:'' };
  const st = STATUS_MAP[t.status] || { label: t.status, cls: 'pending' };
  const dur = formatDuration(t.started_at || t.created_at, t.finished_at);
  const src = SOURCE_TAG[t._type] || SOURCE_TAG['agent-manual'];

  let resultHtml = '';
  if (t.result_summary) resultHtml = `<div class="log-result">${escHtml(t.result_summary)}</div>`;
  if (t.error_reason)   resultHtml = `<div class="log-result error-result">${escHtml(t.error_reason)}</div>`;

  const srcTag = `<span style="
    display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;
    font-size:0.6875rem;font-weight:700;letter-spacing:.03em;
    background:${src.bg};color:${src.color};border:1px solid ${src.color}44;
  ">${src.label}</span>`;

  const badgeCls = st.cls === 'done' ? 'success' : st.cls === 'failed' ? 'danger' : 'warning';

  return `
    <div class="log-entry">
      <div class="log-dot ${st.cls}"></div>
      <div class="log-card">
        <div class="log-header">
          <div class="log-title">${escHtml(t.title || '(无标题)')}</div>
          <div class="log-meta">
            <span class="agent-tag ${agent.cls||''}">${agent.emoji} ${agent.name}</span>
            ${srcTag}
            <span class="badge ${badgeCls}">${st.label}</span>
            ${dur ? `<span class="log-duration">⏱ ${dur}</span>` : ''}
          </div>
        </div>
        ${resultHtml}
        <div class="log-meta" style="margin-top:var(--space-3)">
          <span class="log-time">📅 ${formatTime(t.created_at)}</span>
          <span style="opacity:.4">${(t.id||'').slice(0,8)}</span>
        </div>
      </div>
    </div>`;
}

function dateGroupLabel(iso) {
  if (!iso) return '未知日期';
  const d = new Date(iso);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (+day === +today) return '今天';
  if (+day === +yesterday) return '昨天';
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function renderTimeline() {
  const filtered = getFiltered();
  const shown = filtered.slice(0, (page + 1) * PAGE_SIZE);
  const tl = document.getElementById('timeline');
  if (shown.length === 0) {
    tl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>暂无指令记录</div></div>';
    document.getElementById('loadMore').style.display = 'none';
    return;
  }
  // 按日期分组渲染
  let lastLabel = null;
  const parts = [];
  for (const t of shown) {
    const label = dateGroupLabel(t._sortTime);
    if (label !== lastLabel) {
      parts.push(`<div style="
        font-size:0.75rem;font-weight:700;color:var(--text-muted);
        letter-spacing:.06em;text-transform:uppercase;
        padding:var(--space-2) 0 var(--space-3);
        margin-top:${lastLabel ? 'var(--space-5)' : '0'};
        display:flex;align-items:center;gap:8px;
      "><span style="flex:1;height:1px;background:var(--border);display:block;opacity:.5"></span>
      <span>${label}</span>
      <span style="flex:1;height:1px;background:var(--border);display:block;opacity:.5"></span></div>`);
      lastLabel = label;
    }
    parts.push(renderRow(t));
  }
  tl.innerHTML = parts.join('');
  const lm = document.getElementById('loadMore');
  lm.style.display = shown.length < filtered.length ? 'block' : 'none';
}

function escHtml(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}
function setupFilters() {
  document.getElementById('filterBar').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    page = 0;
    renderTimeline();
  });
  document.getElementById('dateBar').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn || btn.dataset.days === undefined) return;
    document.querySelectorAll('#dateBar .chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    currentDays = parseInt(btn.dataset.days, 10);
    page = 0;
    renderTimeline();
  });
}

function setupSearch() {
  let timer;
  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      page = 0;
      renderTimeline();
    }, 250);
  });
}

document.getElementById('loadMoreBtn').addEventListener('click', () => {
  page++;
  renderTimeline();
});

init();
</script>
</body>
</html>
