<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生图质量数据看板</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="shared.css">
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    Auth.requireLogin();
  </script>
  <style>
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
    .stat-card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
    .stat-card h3 { margin: 0 0 15px; font-size: 14px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    .big-number { font-size: 36px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
    .chart-container { position: relative; height: 200px; margin-top: 10px; }
    .funnel-item { display: flex; align-items: center; gap: 15px; margin: 10px 0; }
    .funnel-bar { height: 24px; background: var(--accent); border-radius: 4px; transition: width 0.5s ease; }
    .funnel-label { font-size: 13px; color: var(--text-secondary); min-width: 100px; }
    .funnel-value { font-size: 14px; font-weight: 600; }
    .trend-up { color: var(--success); }
    .trend-down { color: var(--danger); }
  </style>
</head>
<body>
<nav id="mcn-nav" style="background:#111827;border-bottom:1px solid #1e293b;padding:8px 16px;font-size:13px;display:none;gap:12px;flex-wrap:wrap;align-items:center;position:relative;z-index:9999;">
  <a href="requirement.html" style="color:#94a3b8;text-decoration:none;">需求追踪</a>
  <a href="index.html" style="color:#94a3b8;text-decoration:none;">素材审核</a>
  <a href="image-select.html" style="color:#94a3b8;text-decoration:none;">生图审核</a>
  <a href="draft-review.html" style="color:#94a3b8;text-decoration:none;">草稿审核</a>
  <a href="dashboard.html" style="color:#94a3b8;text-decoration:none;">数据看板</a>
  <a href="tasks.html" style="color:#94a3b8;text-decoration:none;">任务看板</a>
  <a href="command-log.html" style="color:#94a3b8;text-decoration:none;">指令日志</a>
  <a href="user-manage.html" style="color:#94a3b8;text-decoration:none;">用户管理</a>
</nav>
<script>
(function(){
  var u = localStorage.getItem('mcn_current_user');
  if(u) document.getElementById('mcn-nav').style.display='flex';
  // highlight current page
  var links = document.querySelectorAll('#mcn-nav a');
  var path = location.pathname.split('/').pop() || 'index.html';
  links.forEach(function(a){
    if(a.getAttribute('href') === path){
      a.style.color='#6366f1';
      a.style.fontWeight='600';
    }
    a.addEventListener('mouseover',function(){this.style.color='#e2e8f0';});
    a.addEventListener('mouseout',function(){
      if(this.getAttribute('href')===path){this.style.color='#6366f1';}
      else{this.style.color='#94a3b8';}
    });
  });
})();
</script>

  <main class="app">
    <header class="topbar">
      <div>
        <h1>生图质量数据看板</h1>
        <p class="subtitle">追踪生成图片质量趋势与审核统计</p>
      </div>
      <div class="status" id="status">未连接</div>
    </header>

    <section class="config" id="config">
      <label>Supabase 地址<input id="supabase-url" type="text" placeholder="https://xxxx.supabase.co"></label>
      <label>匿名密钥<input id="supabase-key" type="password" placeholder="eyJhbGci..."></label>
      <button id="connect">连接</button>
    </section>

    <section id="dashboard" style="display:none;">
      <!-- 概览统计 -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <h3>总生成量</h3>
          <div class="big-number" id="total-generated">-</div>
          <div class="stat-label">张图片</div>
        </div>
        <div class="stat-card">
          <h3>人工审核通过</h3>
          <div class="big-number" id="human-approved">-</div>
          <div class="stat-label">张图片</div>
        </div>
        <div class="stat-card">
          <h3>整体通过率</h3>
          <div class="big-number" id="overall-rate">-</div>
          <div class="stat-label">人脸验证 → 人工审核</div>
        </div>
        <div class="stat-card">
          <h3>平均美感分</h3>
          <div class="big-number" id="avg-aesthetic">-</div>
          <div class="stat-label">已通过图片</div>
        </div>
      </div>

      <!-- 漏斗图 -->
      <div class="stat-card" style="margin-top: 20px;">
        <h3>审核漏斗</h3>
        <div id="funnel-chart">
          <div class="funnel-item">
            <span class="funnel-label">生成总量</span>
            <div class="funnel-bar" id="funnel-total" style="width: 100%"></div>
            <span class="funnel-value" id="funnel-total-val">-</span>
          </div>
          <div class="funnel-item">
            <span class="funnel-label">人脸通过</span>
            <div class="funnel-bar" id="funnel-face" style="width: 0%"></div>
            <span class="funnel-value" id="funnel-face-val">-</span>
          </div>
          <div class="funnel-item">
            <span class="funnel-label">人工通过</span>
            <div class="funnel-bar" id="funnel-human" style="width: 0%"></div>
            <span class="funnel-value" id="funnel-human-val">-</span>
          </div>
        </div>
      </div>

      <!-- 拒绝原因分布 -->
      <div class="dashboard-grid" style="margin-top: 20px;">
        <div class="stat-card">
          <h3>拒绝原因分布</h3>
          <div class="chart-container">
            <canvas id="reject-reason-chart"></canvas>
          </div>
        </div>
        <div class="stat-card">
          <h3>各人设通过率</h3>
          <div class="chart-container">
            <canvas id="persona-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- 趋势图 -->
      <div class="stat-card" style="margin-top: 20px;">
        <h3>近30天生成与通过趋势</h3>
        <div class="chart-container" style="height: 250px;">
          <canvas id="trend-chart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
